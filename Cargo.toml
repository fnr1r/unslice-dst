[package]
name = "unslice-dst"
version = "0.3.0"
authors = ["fnrir"]
edition = "2024"
rust-version = "1.85"
description = "Fancy slice-like DST support"
readme = "README.md"
repository = "https://github.com/fnr1r/unslice-dst"
license = "MIT OR Apache-2.0"
keywords = ["dst", "slice", "type", "unsized"]
categories = ["data-structures", "no-std", "rust-patterns"]

[dependencies]
plain = { version = "0.2", optional = true }

[features]
default = ["cast_macro_tt_muncher", "std"]

cast_macro_tt_muncher = []

cast_unseal = []
container_rc_optimize = []
container_unseal = []
core_ffi_cstr_impl = []
layout_automatic = ["cast_macro_tt_muncher"]

std = ["cast_macro_tt_muncher"]
std_ffi_cstr_impl = ["std"]

plain = ["dep:plain"]
